<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edit Quiz Details — DaraQuiz AI</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/daraquiz-feature-dashboard.css"><script>window.AQS={ajax_url:'firebase',nonce:'',is_logged_in:true,is_host:true,plugin_url:'./'};</script><script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script><script type="module" src="js/aqs-firebase.js"></script></head><body class="dq-feature-page"><main class="dq-feature-content" style="max-width:850px"><section class="dq-feature-heading"><span class="dq-feature-heading-icon">✎</span><div><h1>Edit quiz details</h1><p>Only quiz information can be changed. Questions, options and correct answers are locked to protect existing results.</p></div></section><section class="dq-feature-card"><form id="form"><label>Quiz title<input id="title" required maxlength="150" style="display:block;width:100%;padding:12px;margin:6px 0 16px;border:1px solid #dce4f4;border-radius:10px"></label><label>Subject<input id="subject" maxlength="100" style="display:block;width:100%;padding:12px;margin:6px 0 16px;border:1px solid #dce4f4;border-radius:10px"></label><label>Description / instructions<textarea id="note" rows="4" style="display:block;width:100%;padding:12px;margin:6px 0 16px;border:1px solid #dce4f4;border-radius:10px"></textarea></label><label>Time limit (minutes)<input id="time" type="number" min="1" max="600" required style="display:block;width:100%;padding:12px;margin:6px 0 16px;border:1px solid #dce4f4;border-radius:10px"></label><label>Allow retakes<select id="retakes" style="display:block;width:100%;padding:12px;margin:6px 0 16px;border:1px solid #dce4f4;border-radius:10px"><option value="0">No</option><option value="1">Yes</option></select></label><label>Show results<select id="show" style="display:block;width:100%;padding:12px;margin:6px 0 16px;border:1px solid #dce4f4;border-radius:10px"><option value="true">Yes</option><option value="false">No</option></select></label><label>Expiry date (optional)<input id="expiry" type="datetime-local" style="display:block;width:100%;padding:12px;margin:6px 0 16px;border:1px solid #dce4f4;border-radius:10px"></label><p class="dq-feature-muted">Protected question data is not sent by this form and cannot be modified here.</p><button class="dq-feature-button primary" type="submit">Save quiz details</button> <a class="dq-feature-button" href="quiz-dashboard.html">Cancel</a><p id="status" role="status"></p></form></section></main><script>(function(){const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('quiz_id');function call(action,data){return new Promise((resolve,reject)=>{let run=()=>window.aqsAjax({action,...data},r=>r?.success===false?reject(Error(r.data||'Request failed')):resolve(r?.data??r),reject);if(window.aqsAjax)run();else document.addEventListener('aqs:firebase:ready',run,{once:true});});}async function load(){try{if(!id)throw Error('Quiz ID is missing.');let q=await call('aqs_get_quiz_for_edit',{quiz_id:id});$('title').value=q.title||'';$('subject').value=q.subject||'';$('note').value=q.quiz_note||'';$('time').value=q.time_limit||30;$('retakes').value=String(q.allow_retakes??1);$('show').value=String(q.show_results!==false);}catch(e){$('status').textContent=e.message;}}$('form').addEventListener('submit',async e=>{e.preventDefault();$('status').textContent='Saving…';try{await call('aqs_update_quiz_metadata',{quiz_id:id,title:$('title').value,subject:$('subject').value,quiz_note:$('note').value,time_limit:$('time').value,allow_retakes:$('retakes').value,show_results:$('show').value,expiry_datetime:$('expiry').value});$('status').textContent='Quiz details saved. Questions and existing answer keys were not changed.';}catch(e){$('status').textContent=e.message||'Could not save changes.';}});load();})();</script></body></html>
