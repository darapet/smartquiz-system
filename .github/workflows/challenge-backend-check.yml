name: Challenge backend checks

on:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'js/aqs-challenge.js'
      - 'js/aqs-skills.js'
      - 'daraquiz-mobile/www/js/aqs-challenge.js'
      - 'daraquiz-mobile/www/js/aqs-skills.js'
      - '.github/workflows/challenge-backend-check.yml'
  pull_request:
    paths:
      - 'functions/**'
      - '.github/workflows/challenge-backend-check.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --ignore-scripts
      - run: npm test
