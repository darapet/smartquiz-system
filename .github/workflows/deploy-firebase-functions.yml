name: Deploy Firebase Functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - '.github/workflows/deploy-firebase-functions.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install function dependencies
        working-directory: functions
        run: npm install --omit=dev

      - name: Validate Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTQUIZ_DARAPET }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "Firebase service-account secret is missing."; exit 1; }
          FIREBASE_SERVICE_ACCOUNT="$FIREBASE_SERVICE_ACCOUNT" node <<'NODE'
          const fs = require('fs');
          const raw = process.env.FIREBASE_SERVICE_ACCOUNT.trim();
          let credentials;
          try {
            credentials = JSON.parse(raw);
          } catch (_) {
            try { credentials = JSON.parse(Buffer.from(raw, 'base64').toString('utf8')); }
            catch (_) { throw new Error('Firebase service-account secret is not valid JSON or base64-encoded JSON.'); }
          }
          for (const field of ['project_id', 'client_email', 'private_key']) {
            if (!credentials[field]) throw new Error(`Firebase service-account secret is missing ${field}.`);
          }
          fs.writeFileSync('/tmp/firebase-service-account.json', JSON.stringify(credentials), { mode: 0o600 });
          fs.appendFileSync(process.env.GITHUB_ENV, 'GOOGLE_APPLICATION_CREDENTIALS=/tmp/firebase-service-account.json\n');
          console.log(`Validated Firebase service account for project ${credentials.project_id}.`);
          NODE

      - name: Deploy Firebase Functions
        run: npx --yes firebase-tools@latest deploy --only functions --project smartquiz-darapet --non-interactive