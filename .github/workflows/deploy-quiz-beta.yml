name: Deploy Quiz Practice Beta Preview

on:
  push:
    branches: [quiz-practice-beta-ui]
    paths:
      - 'quiz-dashboard-beta.html'
      - '.github/workflows/deploy-quiz-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-beta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout beta UI
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Wrangler
        run: npm install --no-save wrangler@4
      - name: Prepare isolated preview site
        run: |
          mkdir -p dist
          cp quiz-dashboard-beta.html dist/index.html
      - name: Create isolated Cloudflare Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare preview credentials are not configured."
            exit 1
          fi
          if ! npx wrangler pages project list | grep -q 'darapet-quiz-practice-beta'; then
            npx wrangler pages project create darapet-quiz-practice-beta --production-branch=quiz-practice-beta-ui
          fi
      - name: Deploy beta preview (separate from production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name=darapet-quiz-practice-beta --branch=beta
