name: AI Control Centre checks

on:
  push:
    branches:
      - feat/ai-special-services-secure
    paths:
      - 'cloudflare-worker/**'
      - 'js/aqs-groq-key.js'
      - 'js/aqs-quotes.js'
      - 'js/aqs-firebase.js'
      - 'js/aqs-gemini-tts.js'
      - 'functions/index.js'
      - 'admin-settings.html'
      - 'admin-ai.html'
  pull_request:
    branches:
      - main
    paths:
      - 'cloudflare-worker/**'
      - 'js/aqs-groq-key.js'
      - 'js/aqs-quotes.js'
      - 'js/aqs-firebase.js'
      - 'js/aqs-gemini-tts.js'
      - 'functions/index.js'
      - 'admin-settings.html'
      - 'admin-ai.html'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check cloudflare-worker/src/index.js
          node --check js/aqs-groq-key.js
          node --check js/aqs-quotes.js
          node --check --input-type=module < js/aqs-firebase.js
          node --check js/aqs-gemini-tts.js
          node --check functions/index.js
          node -e "const fs=require('fs'); for (const f of ['admin-ai.html','admin-settings.html']) { const html=fs.readFileSync(f,'utf8'); for (const m of html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)) if (m[1].trim()) new Function(m[1]); }"
      - name: Run Cloudflare Worker tests
        working-directory: cloudflare-worker
        run: npm test
