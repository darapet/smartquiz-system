<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10152f">
  <title>DaraQuiz AI</title>
  <style>
    html,body{margin:0;background:#f5f7ff;font-family:Inter,system-ui,-apple-system,sans-serif}
    .aqs-mobile-loader{min-height:100vh;display:grid;place-items:center;color:#25294b}
    .aqs-mobile-loader-card{width:min(360px,calc(100% - 40px));padding:24px;border:1px solid #e1e5ff;border-radius:20px;background:#fff;box-shadow:0 18px 50px #20265c12;text-align:center}
    .aqs-mobile-loader-mark{width:42px;height:42px;margin:0 auto 14px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#8c8cff,#4c4cc4);color:#fff;font-weight:900;font-size:.75rem}
    .aqs-mobile-loader-line{height:10px;margin:10px auto 0;border-radius:99px;background:linear-gradient(90deg,#eef0ff 20%,#dfe3ff 50%,#eef0ff 80%);background-size:220% 100%;animation:aqsMobileShimmer 1.2s ease-in-out infinite}
    .aqs-mobile-loader-line.short{width:65%}
    @keyframes aqsMobileShimmer{0%{background-position:200% 0}100%{background-position:-20% 0}}
  </style>
  <script>window.location.replace('social.html');</script>
</head>
<body>
  <div class="aqs-mobile-loader" role="status" aria-live="polite">
    <div class="aqs-mobile-loader-card">
      <div class="aqs-mobile-loader-mark">SQ</div>
      <strong>Opening DaraQuiz…</strong>
      <div class="aqs-mobile-loader-line"></div>
      <div class="aqs-mobile-loader-line short"></div>
      <noscript><p><a href="social.html">Continue</a></p></noscript>
    </div>
  </div>
</body>
</html>
