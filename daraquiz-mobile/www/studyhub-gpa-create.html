<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf3ea"><title>GPA Calculator — StudyHub</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#faf3ea;--surface:rgba(255,255,255,.04);--border:rgba(255,255,255,.08);
  --text:#12304a;--muted:#526579;--accent:#e8912d;--accent2:#d97706;
  --green:#22c55e;--red:#ef4444;--gold:#f59e0b;--blue:#e8912d;--teal:#14b8a6;
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
a{text-decoration:none;color:inherit;}

/* HEADER */
.sh-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(255,255,255,.025);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;backdrop-filter:blur(12px);}
.sh-logo{font-size:1rem;font-weight:900;color:var(--text);}
.sh-logo-ver{font-size:.6rem;font-weight:700;color:var(--muted);margin-left:6px;background:none;-webkit-text-fill-color:var(--muted);}
.sh-back{color:var(--muted);font-size:.8rem;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.03);transition:all .18s;}
.sh-back:hover{border-color:rgba(255,255,255,.15);color:var(--text);}

/* HAMBURGER NAV */
.sh-hdr{gap:12px;}
.sh-hamburger{background:none;border:none;cursor:pointer;padding:8px;border-radius:10px;transition:background .18s;display:flex;flex-direction:column;gap:5px;justify-content:center;align-items:center;width:40px;height:40px;flex-shrink:0;}
.sh-hamburger:hover{background:rgba(255,255,255,.08);}
.sh-hamburger span{display:block;width:20px;height:2px;background:#526579;border-radius:2px;transition:all .28s cubic-bezier(.4,0,.2,1);transform-origin:center;}
.sh-hamburger.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
.sh-hamburger.open span:nth-child(2){opacity:0;transform:scaleX(0);}
.sh-hamburger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}
.sh-hdr-center{display:flex;align-items:baseline;gap:4px;flex:1;}
.sh-hdr-active-tab{font-size:.72rem;font-weight:700;color:var(--muted);margin-left:8px;padding:2px 8px;background:rgba(232,145,45,.12);border:1px solid rgba(232,145,45,.25);border-radius:20px;white-space:nowrap;}
.sh-hdr-actions{display:flex;gap:8px;flex-shrink:0;}
/* Dropdown nav */
#sh-nav-dropdown{position:sticky;top:57px;z-index:99;background:#faf3ea;border-bottom:1px solid var(--border);max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1);}
#sh-nav-dropdown.open{max-height:420px;}
.sh-nav-items{padding:10px 0 14px;}
.sh-nav-item{display:flex;align-items:center;gap:13px;padding:13px 22px;font-size:.9rem;font-weight:700;color:var(--muted);cursor:pointer;transition:all .18s;border-left:3px solid transparent;}
.sh-nav-item:hover{background:rgba(255,255,255,.04);color:var(--text);}
.sh-nav-item.active{color:#12304a;border-left-color:var(--accent);background:rgba(232,145,45,.07);}
.sh-nav-item .nav-icon{font-size:1.1rem;width:22px;text-align:center;flex-shrink:0;}
.sh-nav-item .nav-label{flex:1;}
.sh-nav-item .nav-badge{font-size:.55rem;font-weight:900;background:linear-gradient(135deg,#faf3ea,#ffffff);color:#12304a;padding:2px 6px;border-radius:20px;letter-spacing:.06em;}
.sh-nav-divider{height:1px;background:var(--border);margin:8px 22px;}
/* Keep old .sh-tab hidden for backward compat */
.sh-tabs-wrap{display:none;}

/* PANELS */
.sh-panel{display:none;max-width:780px;margin:0 auto;padding:24px 18px;}
.sh-panel.active{display:block;}

/* SHARED COMPONENTS */
.sh-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px;margin-bottom:16px;}
.sh-label{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;display:block;}
.sh-input{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:.92rem;font-family:inherit;outline:none;transition:border-color .2s;resize:none;}
.sh-input:focus{border-color:rgba(232,145,45,.5);background:rgba(232,145,45,.04);}
.sh-select{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-size:.88rem;font-family:inherit;outline:none;cursor:pointer;-webkit-appearance:none;}
.sh-select option{background:#ffffff;color:var(--text);}
.sh-row{display:flex;gap:12px;flex-wrap:wrap;}
.sh-row .sh-input,.sh-row .sh-select{flex:1;min-width:140px;}
.sh-btn{padding:12px 24px;border-radius:10px;border:none;font-size:.9rem;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s;display:inline-flex;align-items:center;gap:8px;}
.sh-btn-primary{background:linear-gradient(135deg,#e8912d,#c96f16);color:#12304a;box-shadow:0 4px 18px rgba(232,145,45,.3);}
.sh-btn-primary:hover{opacity:.9;transform:translateY(-1px);}
.sh-btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.sh-btn-ghost{background:rgba(255,255,255,.06);border:1px solid var(--border);color:#12304a;}
.sh-btn-ghost:hover{border-color:rgba(255,255,255,.15);color:var(--text);}
.sh-btn-danger{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#12304a;}
.sh-section-title{font-size:1.3rem;font-weight:900;color:var(--text);margin-bottom:6px;}
.sh-section-sub{font-size:.85rem;color:var(--muted);margin-bottom:20px;line-height:1.6;}
.sh-divider{height:1px;background:var(--border);margin:20px 0;}
.sh-badge{display:inline-block;font-size:.68rem;font-weight:700;padding:3px 10px;border-radius:20px;}
.sh-badge-purple{background:rgba(232,145,45,.15);border:1px solid rgba(232,145,45,.3);color:#12304a;}
.sh-badge-green{background:#faf3ea;border:1px solid rgba(34,197,94,.25);color:#12304a;}
.sh-badge-gold{background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);color:#fcd34d;}
.sh-badge-red{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);color:#12304a;}
.sh-skeleton{background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 75%);background-size:200% 100%;animation:sh-shimmer 1.4s infinite;border-radius:6px;height:16px;margin-bottom:8px;}
@keyframes sh-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sh-spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);border-radius:50%;animation:sh-spin .8s linear infinite;}
@keyframes sh-spin{100%{transform:rotate(360deg)}}

/* ══════════════════════════════
   1. AI STUDY NOTES
══════════════════════════════ */
.sh-notes-output{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:20px;font-size:.88rem;line-height:1.9;color:#12304a;min-height:200px;display:none;position:relative;}
.sh-notes-output h1,.sh-notes-output h2,.sh-notes-output h3{color:var(--text);font-weight:800;margin:18px 0 8px;line-height:1.3;}
.sh-notes-output h1{font-size:1.2rem;border-bottom:2px solid rgba(232,145,45,.3);padding-bottom:8px;}
.sh-notes-output h2{font-size:1rem;color:#12304a;}
.sh-notes-output h3{font-size:.92rem;color:#12304a;}
.sh-notes-output p{margin-bottom:10px;}
.sh-notes-output ul,.sh-notes-output ol{margin:8px 0 12px 20px;}
.sh-notes-output li{margin-bottom:6px;}
.sh-notes-output strong{color:#fcd34d;font-weight:700;}
.sh-notes-output em{color:#12304a;font-style:normal;font-weight:600;}
.sh-notes-output code{background:rgba(232,145,45,.15);border:1px solid rgba(232,145,45,.25);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:.83rem;color:#12304a;}
.sh-notes-output blockquote{border-left:3px solid var(--accent);padding-left:14px;color:var(--muted);margin:12px 0;font-style:italic;}
.sh-notes-toolbar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px;flex-wrap:wrap;}

/* ══════════════════════════════
   2. FLASHCARDS
══════════════════════════════ */
.sh-fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:16px;}
.sh-fc-card{height:180px;perspective:1000px;cursor:pointer;}
.sh-fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);}
.sh-fc-card.flipped .sh-fc-inner{transform:rotateY(180deg);}
.sh-fc-front,.sh-fc-back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;}
.sh-fc-front{background:rgba(232,145,45,.08);border:2px solid rgba(232,145,45,.25);}
.sh-fc-back{background:#faf3ea;border:2px solid rgba(34,197,94,.2);transform:rotateY(180deg);}
.sh-fc-label{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;}
.sh-fc-front .sh-fc-label{color:rgba(165,180,252,.6);}
.sh-fc-back .sh-fc-label{color:rgba(134,239,172,.6);}
.sh-fc-text{font-size:.88rem;font-weight:700;color:var(--text);line-height:1.5;}
.sh-fc-back .sh-fc-text{font-size:.82rem;font-weight:500;color:#12304a;}
.sh-fc-hint{font-size:.7rem;color:var(--muted);margin-top:8px;}
.sh-fc-nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:12px;}
.sh-fc-solo{height:220px;max-width:460px;margin:0 auto;}
.sh-fc-progress{text-align:center;font-size:.82rem;color:var(--muted);font-weight:600;margin-top:8px;}
.sh-fc-counter{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
.sh-fc-dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);cursor:pointer;transition:all .18s;}
.sh-fc-dot.known{background:var(--green);border-color:var(--green);}
.sh-fc-dot.unknown{background:var(--red);border-color:var(--red);}
.sh-fc-dot.current{outline:2px solid var(--accent);outline-offset:2px;}

/* ══════════════════════════════
   3. GPA CALCULATOR
══════════════════════════════ */
.sh-gpa-row{display:grid;grid-template-columns:1fr 100px 90px 28px;gap:8px;align-items:center;margin-bottom:8px;}
.sh-gpa-row.header{font-size:.7rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;}
.sh-gpa-add-btn{display:flex;align-items:center;gap:8px;background:rgba(232,145,45,.08);border:1px dashed rgba(232,145,45,.3);border-radius:10px;padding:10px 16px;color:#12304a;font-size:.85rem;font-weight:700;cursor:pointer;width:100%;margin-top:4px;font-family:inherit;transition:all .18s;}
.sh-gpa-add-btn:hover{background:rgba(232,145,45,.15);}
.sh-gpa-result{background:linear-gradient(135deg,rgba(232,145,45,.12),rgba(217,119,6,.1));border:1px solid rgba(232,145,45,.25);border-radius:14px;padding:20px;text-align:center;margin-top:16px;}
.sh-gpa-score{font-size:3rem;font-weight:900;color:var(--text);line-height:1.1;}
.sh-gpa-class{font-size:.95rem;font-weight:800;color:var(--text);margin-top:4px;}
.sh-gpa-breakdown{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;}
.sh-gpa-stat{background:rgba(255,255,255,.04);border-radius:10px;padding:12px;text-align:center;}
.sh-gpa-stat-val{font-size:1.1rem;font-weight:800;color:var(--text);}
.sh-gpa-stat-lbl{font-size:.68rem;color:var(--muted);font-weight:600;margin-top:3px;}
.sh-gpa-del{width:28px;height:28px;border-radius:6px;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#12304a;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;flex-shrink:0;}
.sh-gpa-del:hover{background:rgba(239,68,68,.2);}

/* TOAST */
#sh-toast{position:fixed;bottom:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.sh-toast{background:#faf3ea;border:1px solid rgba(255,255,255,.12);color:var(--text);border-radius:10px;padding:10px 16px;font-size:.82rem;font-weight:600;backdrop-filter:blur(12px);}

/* Responsive */
@media(max-width:768px){
  .sh-panel{padding:16px 14px;}
  .sh-gpa-row{grid-template-columns:1fr 90px 80px 28px;}
  .sh-result-grid{grid-template-columns:repeat(2,1fr);}
  
  
}
/* ── AI Visual Board (Canvas Concept Animator) ── */
.ait-visual-board{width:100%;border-radius:12px;overflow:hidden;border:1px solid rgba(232,145,45,.22);background:#faf3ea;margin-bottom:14px;flex-shrink:0;}
.ait-visual-board-header{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:rgba(232,145,45,.08);border-bottom:1px solid rgba(232,145,45,.15);}
.ait-vb-title{font-size:.58rem;font-weight:800;color:#12304a;text-transform:uppercase;letter-spacing:.1em;display:flex;align-items:center;gap:6px;}
.ait-vb-dot{width:5px;height:5px;border-radius:50%;background:#faf3ea;animation:ait-vb-blink 1.5s ease-in-out infinite;flex-shrink:0;}
.ait-vb-dot.active{background:#faf3ea;box-shadow:0 0 6px rgba(52,211,153,.8);}
@keyframes ait-vb-blink{0%,100%{opacity:.35}50%{opacity:1}}
.ait-vb-mode{font-size:.58rem;color:#475569;font-weight:600;letter-spacing:.03em;}
#ait-visual-canvas{display:block;width:100%;height:158px;cursor:default;}
.ait-vb-math-overlay{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:center;flex-direction:column;gap:2px;padding:10px 14px;overflow:hidden;pointer-events:none;color:#12304a;}
.ait-vb-math-line{min-height:22px;max-width:100%;font:700 12px/1.35 Inter,sans-serif;white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;}
.ait-vb-math-line::-webkit-scrollbar{display:none;}
.ait-vb-math-line:first-child{font-size:13px;color:#12304a;border-bottom:1px solid rgba(232,145,45,.25);padding-bottom:3px;margin-bottom:1px;width:100%;}
.ait-vb-math-line.ait-vb-math-result{color:#34d399;background:#faf3ea;border-left:3px solid #34d399;padding-left:8px;width:100%;}
.ait-vb-math-line .katex,.ait-vb-math-line mjx-container{font-size:1.08em;}
.ait-vb-math-line .katex-display{margin:0;text-align:left;}
@media(max-width:768px){.ait-vb-math-overlay{padding:7px 10px;}.ait-vb-math-line{font-size:11px;min-height:20px;}.ait-vb-math-line:first-child{font-size:12px;}}
@media(max-width:768px){#ait-visual-canvas{height:118px;}.ait-visual-board{margin-bottom:10px;}}

/* Professional flashcards workspace */
.fc-study-complete{margin:22px auto 8px;max-width:540px;padding:26px 20px;text-align:center;border:1px solid rgba(34,197,94,.22);border-radius:16px;background:rgba(34,197,94,.055)}.fc-complete-icon{width:48px;height:48px;margin:0 auto 12px;display:grid;place-items:center;border-radius:50%;background:rgba(34,197,94,.15);color:#16a34a;font-size:1.5rem;font-weight:900}.fc-study-complete strong{display:block;font-size:1rem;color:var(--text)}.fc-study-complete p{font-size:.76rem;line-height:1.55;color:var(--muted);margin:8px auto 16px;max-width:420px}.fc-study-complete[hidden]{display:none!important}
.fc-create-card{padding:18px!important}.fc-method-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-bottom:18px}
.fc-method{min-height:42px;border:1px solid var(--border);border-radius:11px;background:rgba(255,255,255,.035);color:var(--muted);font-size:.78rem;font-weight:800}.fc-method.active{background:rgba(232,145,45,.13);border-color:rgba(232,145,45,.45);color:var(--text);box-shadow:0 4px 14px rgba(232,145,45,.08)}
.fc-source-pane[hidden],.fc-study-area[hidden],.fc-grid-wrap[hidden]{display:none!important}.fc-options-row{display:flex;align-items:end;gap:14px;margin-top:12px}.fc-options-row>div{width:150px;flex-shrink:0}.fc-options-row p{font-size:.74rem;color:var(--muted);line-height:1.5;margin:0 0 7px}
.fc-notes-area{width:100%;min-height:145px;resize:vertical;padding:12px!important;line-height:1.6}.fc-upload-box{min-height:145px;border:1.5px dashed rgba(232,145,45,.4);border-radius:14px;background:rgba(232,145,45,.045);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:18px;text-align:center;cursor:pointer}.fc-upload-box:hover{background:rgba(232,145,45,.09);border-color:var(--accent)}
.fc-upload-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(232,145,45,.15);font-size:1.3rem;color:var(--accent)}.fc-upload-box strong{font-size:.86rem;color:var(--text)}.fc-upload-box>span:not(.fc-upload-icon){font-size:.72rem;color:var(--muted);line-height:1.45}.fc-file-name{font-size:.75rem;font-weight:800;color:var(--accent)!important;overflow-wrap:anywhere}
.fc-manual-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fc-manual-grid textarea{width:100%;resize:vertical;padding:11px!important;line-height:1.5}.fc-add-card-btn{margin-top:10px}.fc-manual-count{font-size:.72rem;color:var(--muted);margin:9px 0}.fc-generate-btn{margin-top:15px;min-width:210px}.fc-status{font-size:.76rem;color:var(--muted);margin-top:10px;min-height:18px}
.fc-decks-section{margin:22px 0}.fc-section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}.fc-section-heading strong{display:block;font-size:.92rem;color:var(--text)}.fc-section-heading span{display:block;font-size:.72rem;color:var(--muted);margin-top:3px}.fc-deck-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fc-deck-item{padding:14px;border:1px solid var(--border);border-radius:13px;background:var(--surface);color:var(--text);text-align:left;cursor:pointer;transition:.18s}.fc-deck-item:hover{border-color:rgba(232,145,45,.45);transform:translateY(-1px)}.fc-deck-item strong{display:block;font-size:.82rem;margin-bottom:5px}.fc-deck-item span{font-size:.7rem;color:var(--muted)}.fc-empty-decks{padding:18px;border:1px dashed var(--border);border-radius:12px;color:var(--muted);font-size:.76rem;line-height:1.6}
.fc-study-area{margin:16px 0 30px;padding:18px;border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.025)}.fc-study-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.fc-study-head h3{font-size:1rem;margin:4px 0 0;color:var(--text)}.fc-study-eyebrow{font-size:.62rem;font-weight:900;letter-spacing:.12em;color:var(--accent)}
.fc-progress-stats{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:16px 0 8px;font-size:.7rem;font-weight:800}.fc-stat-mastered{color:#16a34a}.fc-stat-review{color:#c77b2e}.fc-stat-position{color:var(--muted)}.fc-progress-track{height:7px;border-radius:99px;background:rgba(148,163,184,.15);overflow:hidden;margin-bottom:16px}.fc-progress-track>div{height:100%;width:0;background:linear-gradient(90deg,#22c55e,#16a34a);border-radius:99px;transition:width .25s}
.fc-study-card{min-height:260px;max-width:650px;margin:0 auto 16px;cursor:pointer}.fc-study-card .sh-fc-text{font-size:1.1rem;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.fc-study-card .sh-fc-label{letter-spacing:.12em}.fc-study-controls{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}.fc-study-controls .sh-btn{font-size:.76rem;padding:10px 13px}
.fc-rate-again{background:rgba(239,68,68,.10)!important;border:1px solid rgba(239,68,68,.3)!important;color:#b91c1c!important}.fc-rate-hard{background:rgba(245,158,11,.10)!important;border:1px solid rgba(245,158,11,.3)!important;color:#a16207!important}.fc-rate-easy{background:rgba(34,197,94,.12)!important;border:1px solid rgba(34,197,94,.3)!important;color:#15803d!important}
.fc-study-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;color:var(--muted);font-size:.69rem;line-height:1.5}.fc-grid-wrap{margin-top:16px}.fc-grid-card{min-height:190px;cursor:pointer}.fc-grid-card .sh-fc-text{white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:600px){.fc-method-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}.fc-options-row{align-items:stretch;flex-direction:column;gap:6px}.fc-options-row>div{width:100%}.fc-manual-grid{grid-template-columns:1fr}.fc-study-controls{display:grid;grid-template-columns:repeat(3,1fr)}.fc-study-foot{align-items:flex-start;flex-direction:column}}


.sh-workspace-top{max-width:820px;margin:0 auto;padding:16px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.sh-workspace-top a{font-size:.78rem;font-weight:800;color:#526579;border:1px solid rgba(82,101,121,.22);border-radius:9px;padding:9px 12px}.sh-workspace-top strong{font-size:.8rem;color:#12304a}@media(max-width:600px){.sh-workspace-top{padding:12px 12px 0}}
</style></head><body><header class="sh-workspace-top"><a href="studyhub-dashboard.html">← StudyHub Dashboard</a><strong>GPA Calculator</strong></header><main><div id="sh-panel-gpa" class="sh-panel active">
  <div class="sh-section-title">📊 GPA / CGPA Calculator</div>
  <div class="sh-section-sub">Nigerian university grading system (5-point scale). Add your courses, select grades, and calculate your semester GPA or cumulative CGPA instantly.</div>

  <div class="sh-card">
    <div class="sh-gpa-row header"><span>Course Name</span><span>Credit Units</span><span>Grade</span><span></span></div>
    <div id="gpa-courses"></div>
    <button class="sh-gpa-add-btn" onclick="shGpaAddRow()">+ Add Course</button>
  </div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
    <button class="sh-btn sh-btn-primary" onclick="shCalcGPA()">📊 Calculate GPA</button>
    <button class="sh-btn sh-btn-ghost" onclick="shGpaReset()">🔄 Reset</button>
  </div>

  <div id="gpa-result" style="display:none;" class="sh-gpa-result">
    <div class="sh-gpa-score" id="gpa-score">0.00</div>
    <div class="sh-gpa-class" id="gpa-class">—</div>
    <div class="sh-gpa-breakdown">
      <div class="sh-gpa-stat"><div class="sh-gpa-stat-val" id="gpa-total-cu">0</div><div class="sh-gpa-stat-lbl">Credit Units</div></div>
      <div class="sh-gpa-stat"><div class="sh-gpa-stat-val" id="gpa-total-qp">0</div><div class="sh-gpa-stat-lbl">Quality Points</div></div>
      <div class="sh-gpa-stat"><div class="sh-gpa-stat-val" id="gpa-courses-count">0</div><div class="sh-gpa-stat-lbl">Courses</div></div>
    </div>
  </div>
</main><div id="sh-toast"></div><script type="module" src="js/aqs-firebase.js?v=client-keys-1"></script><script src="js/aqs-groq-key.js?v=client-keys-2"></script><script>
function shToast(msg, dur=3000){
  const el=document.createElement('div');
  el.className='sh-toast'; el.textContent=msg;
  document.getElementById('sh-toast').appendChild(el);
  setTimeout(()=>el.remove(), dur);
}

/* AI generation uses the Study Hub key pool loaded from Admin Settings. No provider keys belong in this public page. */
async function shAI(prompt, maxTokens=1200){
  if(typeof window.studyhubGroqFetch !== 'function') throw new Error('Study Hub AI pool is unavailable. Refresh the page and try again.');
  const response = await window.studyhubGroqFetch({
    model: window._AQS_GROQ_MODEL || 'openai/gpt-oss-20b',
    messages: [{role:'user', content:String(prompt || '')}],
    max_tokens: maxTokens,
    temperature: 0.7
  });
  const data = await response.json().catch(()=>({}));
  if(!response.ok){
    const message = data && data.error && (data.error.message || data.error);
    if(response.status === 429) throw new Error('AI is busy right now. Please wait one minute and try again.');
    throw new Error(message || ('AI request failed (' + response.status + ').'));
  }
  const text = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if(!text) throw new Error('The AI service returned an empty response. Please try again.');
  return text;
}


/* ══════════════════════════════
   3. GPA CALCULATOR
══════════════════════════════ */
const GPA_GRADES={A:5,B:4,C:3,D:2,E:1,F:0};
let _gpaCourses=[];

function shGpaAddRow(){
  const id=Date.now();
  _gpaCourses.push(id);
  const row=document.createElement('div');
  row.className='sh-gpa-row'; row.id='gpa-row-'+id;
  row.innerHTML=`<input class="sh-input" placeholder="Course name…" style="font-size:.82rem;padding:8px 10px;">
<input class="sh-input" type="number" min="1" max="6" value="3" style="font-size:.82rem;padding:8px 10px;">
<select class="sh-select" style="font-size:.82rem;padding:8px 10px;">${Object.keys(GPA_GRADES).map(g=>`<option value="${g}">${g}</option>`).join('')}</select>
<button class="sh-gpa-del" onclick="shGpaDel(${id})">✕</button>`;
  document.getElementById('gpa-courses').appendChild(row);
}

function shGpaDel(id){
  document.getElementById('gpa-row-'+id)?.remove();
  _gpaCourses=_gpaCourses.filter(i=>i!==id);
}

function shCalcGPA(){
  const rows=document.querySelectorAll('#gpa-courses .sh-gpa-row');
  if(!rows.length){ shToast('⚠️ Add at least one course'); return; }
  let totalCU=0,totalQP=0,count=0;
  rows.forEach(row=>{
    const inputs=row.querySelectorAll('input');
    const sel=row.querySelector('select');
    const cu=parseFloat(inputs[1]?.value)||0;
    const grade=sel?.value||'F';
    const gp=GPA_GRADES[grade]||0;
    totalCU+=cu; totalQP+=cu*gp; count++;
  });
  const gpa=totalCU?totalQP/totalCU:0;
  const cls=gpa>=4.5?'First Class Honours':gpa>=3.5?'Second Class Upper (2:1)':gpa>=2.4?'Second Class Lower (2:2)':gpa>=1.5?'Third Class Honours':gpa>=1.0?'Pass':'Fail';
  document.getElementById('gpa-score').textContent=gpa.toFixed(2);
  document.getElementById('gpa-class').textContent=cls;
  document.getElementById('gpa-total-cu').textContent=totalCU;
  document.getElementById('gpa-total-qp').textContent=totalQP.toFixed(1);
  document.getElementById('gpa-courses-count').textContent=count;
  document.getElementById('gpa-result').style.display='';
  try {
    var savedGpa = JSON.parse(localStorage.getItem('aqs_gpa_v1') || '[]');
    if (!Array.isArray(savedGpa)) savedGpa = [];
    savedGpa.unshift({gpa:gpa.toFixed(2),cls:cls,at:Date.now(),totalCU:totalCU,totalQP:Number(totalQP.toFixed(1)),courses:count});
    localStorage.setItem('aqs_gpa_v1', JSON.stringify(savedGpa.slice(0,40)));
    if (window.aqsTrackStudyHubActivity) window.aqsTrackStudyHubActivity('gpa', 'GPA '+gpa.toFixed(2));
  } catch (saveError) {
    console.warn('[StudyHub:GPA] Result could not be saved:', saveError);
    shToast('GPA calculated, but could not be saved on this device.');
  }
}

function shGpaReset(){
  document.getElementById('gpa-courses').innerHTML='';
  document.getElementById('gpa-result').style.display='none';
  _gpaCourses=[];
  shGpaAddRow(); shGpaAddRow(); shGpaAddRow();
}


window.addEventListener('load',function(){shGpaAddRow();shGpaAddRow();shGpaAddRow();});
</script></body></html>
