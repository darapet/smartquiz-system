<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiplayer Session — DaraQuiz AI</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/daraquiz-feature-dashboard.css"></head>
<body class="dq-feature-page"><aside class="dq-feature-sidebar"><a class="dq-feature-brand" href="index.html"><span class="dq-feature-avatar">D</span><span><strong>DaraQuiz AI</strong><small>MULTIPLAYER REPORT</small></span></a><nav class="dq-feature-nav"><a href="multiplayer-dashboard.html">♟ Multiplayer Dashboard</a><a href="quiz-dashboard.html">▤ Quiz &amp; Practice</a></nav></aside>
<div class="dq-feature-main"><header class="dq-feature-topbar"><a class="dq-feature-button" href="multiplayer-dashboard.html">← Back</a><div class="dq-feature-top-actions"><button class="dq-feature-button primary" onclick="window.print()">Print session</button></div></header><main class="dq-feature-content"><section class="dq-feature-heading"><span class="dq-feature-heading-icon">♟</span><div><h1 id="title">Multiplayer session</h1><p id="subtitle">Loading session data…</p></div><div class="dq-feature-heading-actions"><a class="dq-feature-button primary" id="continue" href="multiplayer-host.html">Continue room</a></div></section>

<script type="module">
import{initializeApp,getApps,getApp}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import{getAuth,signInAnonymously,setPersistence,browserLocalPersistence}from'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const config={apiKey:'AIzaSyCFVx82QXdKdufbUIHBBOOzDefNoFBYxtY',authDomain:'smartquiz-darapet.firebaseapp.com',databaseURL:'https://smartquiz-darapet-default-rtdb.firebaseio.com',projectId:'smartquiz-darapet',storageBucket:'smartquiz-darapet.firebasestorage.app',messagingSenderId:'915234258423',appId:'1:915234258423:web:0c8fc183e9e3ce0852c2f2'};
const app=getApps().length?getApp():initializeApp(config),auth=getAuth(app),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{await setPersistence(auth,browserLocalPersistence);if(auth.authStateReady)await auth.authStateReady();if(!auth.currentUser)await signInAnonymously(auth);const id=new URLSearchParams(location.search).get('room_id');if(!id)throw Error('Room ID is missing.');const token=await auth.currentUser.getIdToken();const res=await fetch('https://smartquiz-system3.daramolapeter98.workers.dev/api/multiplayer',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({action:'details',roomId:id})});const data=await res.json();if(!res.ok)throw Error(data.error||'Could not load session.');const r=data.room||{},p=data.players||[];$('title').textContent=r.title||'Multiplayer session';$('subtitle').textContent='Room '+id+' · '+(r.createdAt?new Date(r.createdAt).toLocaleString():'Date unavailable');$('continue').href='multiplayer-host.html?room='+encodeURIComponent(id);$('players').textContent=p.length;$('questions').textContent=r.questionCount||0;$('phase').textContent=r.phase||'Unknown';const total=p.reduce((n,x)=>n+x.answered,0),correct=p.reduce((n,x)=>n+x.correct,0);$('accuracy').textContent=total?Math.round(correct/total*100)+'%':'—';$('rows').innerHTML=p.length?p.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.name)+'</td><td>'+x.score+'</td><td>'+x.correct+'</td><td>'+x.wrong+'</td><td>'+(x.answered?Math.round(x.totalLatency/x.answered*10)/10+'s':'—')+'</td></tr>').join(''):'<tr><td colspan="6" class="dq-feature-empty">No player results are stored.</td></tr>';$('note').textContent='The current Multiplayer data model stores player totals and response-time averages, but not individual question text or selected options.';}catch(e){$('rows').innerHTML='<tr><td colspan="6" class="dq-feature-empty">'+esc(e.message||'Could not load session.')+'</td></tr>';$('note').textContent=e.message||'';}}load();
</script></body></html>
