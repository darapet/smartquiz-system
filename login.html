<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In — xzily AI</title>
<link rel="stylesheet" href="css/aqs-style.css">
<link rel="stylesheet" href="css/aqs-auth.css">
<style>
body{margin:0;padding:0;background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);min-height:100vh;font-family:'Inter',sans-serif;}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
window.AQS = {
    ajax_url: 'firebase',
    nonce: '',
    auth_nonce: '',
    home_url: 'index.html',
    create_page_url: 'quiz-setup.html',
    studio_url: 'studio.html',
    dashboard_url: 'dashboard.html',
    register_url: 'register.html',
    is_logged_in: false,
    is_host: false,
    is_admin: false,
    groq_key: '',
    plugin_url: './'
};
</script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script type="module" src="js/aqs-firebase.js?v=20261029-google-auth-1"></script>
  <link rel="stylesheet" href="css/aqs-cream-theme.css?v=563">
</head>
<body data-aqs-page="login" data-aqs-page-group="auth">
<header class="aqs-phase2-page-header" aria-label="Sign In"><a href="index.html" class="aqs-phase2-back">← Home</a><span class="aqs-phase2-page-title">Sign In</span></header>

<div class="aqs-auth-page">
<div class="aqs-auth-card">
    <div class="aqs-auth-brand">
        <div class="aqs-auth-logo-icon" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 36 36" fill="none">
                <polygon points="18,2 34,10 34,26 18,34 2,26 2,10" fill="white" opacity="0.9"/>
                <circle cx="18" cy="18" r="6" fill="#6366f1"/>
            </svg>
        </div>
        <h1 class="aqs-auth-title">Welcome back</h1>
        <p class="aqs-auth-subtitle">Sign in to your xzily AI account with your password.</p>
    </div>

    <div id="aqs-login-alert" class="aqs-auth-alert" role="alert"></div>
    <button type="button" id="aqs-login-google" class="aqs-social-btn google" style="width:100%;margin-bottom:18px;">Continue with Google</button>
    <div class="aqs-auth-divider"><span>or sign in with email</span></div>

    <form id="aqs-login-form" autocomplete="off" novalidate>
        <div class="aqs-auth-field">
            <label for="login-identifier">Email or Username</label>
            <input type="text" id="login-identifier" placeholder="you@example.com" required autocomplete="username">
        </div>
        <div class="aqs-auth-field">
            <label for="login-password">Password</label>
            <div class="aqs-pw-wrap">
                <input type="password" id="login-password" placeholder="Your password" required autocomplete="current-password">
                <button type="button" class="aqs-pw-toggle" data-target="login-password" aria-label="Toggle password visibility">Show</button>
            </div>
        </div>
        <button type="button" id="aqs-forgot-password" style="display:block;margin:-4px 0 16px auto;border:0;background:none;color:#a5b4fc;font:inherit;font-size:.82rem;cursor:pointer;padding:0;">Forgot password?</button>
        <button type="submit" class="aqs-auth-submit" id="aqs-login-submit">Sign In</button>
    </form>

    <p class="aqs-auth-switch">Don't have an account? <a href="register.html">Create account</a></p>
</div>
</div>
<script src="js/aqs-notifs-bar.js"></script>
<script src="js/aqs-auth.js"></script>
<script src="js/aqs-session.js"></script>
</body>
</html>
