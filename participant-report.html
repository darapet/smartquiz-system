<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Participant Analysis — DaraQuiz AI</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/daraquiz-feature-dashboard.css"><script>window.AQS={ajax_url:'firebase',nonce:'',home_url:'index.html',is_logged_in:true,plugin_url:'./'};</script><script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script><script type="module" src="js/aqs-firebase.js"></script><style>.answer-card{padding:17px;border:1px solid var(--dq-line);border-radius:15px;margin:12px 0;background:#fff}.answer-option{padding:9px 12px;border-radius:9px;margin:6px 0;background:#f5f7fc}.answer-option.correct{background:#e4f8eb;color:#126b35;border:1px solid #8ed8a8}.answer-option.wrong{background:#ffebeb;color:#a61b1b;border:1px solid #f3a4a4}.explanation{padding:11px;background:#f0f4ff;border-radius:10px;margin-top:10px;color:#33416d}@media print{.dq-feature-sidebar,.dq-feature-topbar,.no-print{display:none!important}.dq-feature-main{margin:0}}</style></head><body class="dq-feature-page"><aside class="dq-feature-sidebar"><a class="dq-feature-brand" href="index.html"><span class="dq-feature-avatar">D</span><span><strong>DaraQuiz AI</strong><small>PARTICIPANT REPORT</small></span></a><nav class="dq-feature-nav"><a href="quiz-dashboard.html">Quiz &amp; Practice</a></nav></aside><div class="dq-feature-main"><header class="dq-feature-topbar"><a class="dq-feature-button" href="javascript:history.back()">← Back</a><div class="dq-feature-top-actions"><button class="dq-feature-button primary no-print" onclick="window.print()">Print full report</button></div></header><main class="dq-feature-content"><section class="dq-feature-heading"><span class="dq-feature-heading-icon">✓</span><div><h1 id="title">Participant Analysis</h1><p id="meta">Loading verified attempt details…</p></div></section><section class="dq-feature-stats"><article class="dq-feature-stat"><div><strong id="score">—</strong><span>Score</span></div></article><article class="dq-feature-stat"><div><strong id="percent">—</strong><span>Percentage</span></div></article><article class="dq-feature-stat"><div><strong id="remark">—</strong><span>Performance band</span></div></article><article class="dq-feature-stat"><div><strong id="duration">—</strong><span>Time taken</span></div></article></section><section class="dq-feature-card"><h2 id="participant">Participant</h2><div id="questions"><p class="dq-feature-empty">Loading question analysis…</p></div></section></main></div><script>(function(){const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function call(){return new Promise((resolve,reject)=>{let go=()=>window.aqsAjax({action:'aqs_get_attempt_analysis',attempt_id:new URLSearchParams(location.search).get('attempt_id')},r=>r?.success===false?reject(Error(r.data||'Request failed')):resolve(r?.data??r),reject);if(window.aqsAjax)go();else document.addEventListener('aqs:firebase:ready',go,{once:true});});}function load(){call().then(d=>{let p=Number(d.total)?Number(d.score)/Number(d.total)*100:0;$('title').textContent=d.quiz_title||'Quiz Report';$('meta').textContent=(d.subject||'')+' · '+(d.finished_at||'Date not available');$('score').textContent=(d.score??0)+' / '+(d.total??0);$('percent').textContent=p.toFixed(1)+'%';$('remark').textContent=p>=70?'Excellent':p>=60?'Very good':p>=50?'Good':p>=40?'Needs improvement':'Keep practising';$('duration').textContent=d.duration_seconds==null?'Not recorded':Math.floor(d.duration_seconds/60)+'m '+Math.round(d.duration_seconds%60)+'s';$('participant').textContent=d.participant_name||'Participant';$('questions').innerHTML=(d.analysis||[]).map((q,i)=>{let opts=Array.isArray(q.options)?q.options:[];let written=q.type==='short'||q.type==='written'||q.type==='german';return '<article class="answer-card"><h3>Question '+(i+1)+': '+esc(q.question)+'</h3>'+(written?'<p><b>Participant answer:</b> '+esc(q.given===-1?'No answer':q.given)+'</p><p class="answer-option correct"><b>Expected answer:</b> '+esc(q.correct)+'</p>':opts.map((o,j)=>'<div class="answer-option '+(j===Number(q.correct)?'correct ':'')+(j===Number(q.given)&&!q.is_correct?'wrong':'')+'">'+String.fromCharCode(65+j)+'. '+esc(o)+(j===Number(q.correct)?' ✓ Correct answer':'')+(j===Number(q.given)?(q.is_correct?' · Selected':' · Participant selected'):'')+'</div>').join(''))+'<p><b>Result:</b> '+(q.is_correct?'Correct':'Incorrect / unanswered')+'</p>'+(q.time_spent_seconds!=null?'<p><b>Time on question:</b> '+esc(q.time_spent_seconds)+' seconds</p>':'')+(q.explanation?'<div class="explanation"><b>Explanation:</b> '+esc(q.explanation)+'</div>':'')+'</article>';}).join('')||'<p class="dq-feature-empty">No question-level analysis is available for this attempt.</p>';}).catch(e=>$('questions').textContent=e.message||'Could not load report.');}load();})();</script></body></html>
